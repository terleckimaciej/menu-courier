name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump when the application changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if ! git diff --name-only "$BASE_REF...HEAD" \
              | grep -qE '^(src/|Dockerfile$|pyproject\.toml$|poetry\.lock$)'; then
            echo "No application changes, version bump not required."
            exit 0
          fi
          read_version() {
            python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'
          }
          base_version=$(git show "$BASE_REF:pyproject.toml" | read_version)
          head_version=$(read_version < pyproject.toml)
          if [ "$base_version" = "$head_version" ]; then
            echo "Application changed but version is still $head_version; bump it in pyproject.toml." >&2
            exit 1
          fi
          echo "Version bumped: $base_version -> $head_version"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run pre-commit checks
        run: poetry run pre-commit run --all-files

      - name: Run tests
        run: poetry run pytest
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost/test  # pragma: allowlist secret
          FB_PAGE_ACCESS_TOKEN: test-token
          APIFY_API_TOKEN: test-token
